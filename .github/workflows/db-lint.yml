name: Schema and docs

# No path filter at the trigger level -- this job is now a required
# status check on main (see CONTRIBUTING.md), and a path-filtered
# trigger means the check never runs at all for a PR that doesn't touch
# a migration, which a required check can never be satisfied by (GitHub
# just leaves the PR permanently blocked, waiting on a check that will
# never report). Runs on every PR instead, and the lint steps themselves
# are skipped internally when nothing under supabase/migrations/
# changed, so a non-migration PR still gets a fast, real "success"
# without paying for the Supabase stack it doesn't need.
on:
  pull_request:

jobs:
  # The job name is the required status check's context on main. It says
  # "lint" for historical reasons and must keep saying it: renaming the
  # job leaves main waiting forever on a check that no longer reports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Both schema checks below are regexes over SQL and TypeScript,
      # which is the kind of code that keeps passing after it has
      # stopped working. This runs on every PR, gated on nothing, so a
      # change to a checker cannot land unverified.
      - name: Test the schema checks themselves
        run: node --test scripts/*.test.mjs

      # Needs no database and no network, so it reports on every PR --
      # including the many that only touch docs, which are exactly the
      # PRs where a link breaks.
      - name: Documentation
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-docs.mjs

      - name: Check for migration changes
        id: changes
        run: |
          # The diff is checked separately from the grep, because the two
          # failures mean opposite things and this used to conflate them.
          # `grep -q` exits non-zero on no match AND on no input, so a
          # git diff that failed -- the base ref not fetched is the easy
          # way to see it -- took the else branch and answered "no
          # migrations changed". Every database-backed check below is
          # gated on that answer, so the whole database half of CI
          # skipped itself and the board went green. A check that cannot
          # tell whether it should run must not answer "no".
          if ! changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD"); then
            echo "::error::could not diff against origin/${{ github.base_ref }} -- refusing to guess whether migrations changed"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -q '^supabase/migrations/'; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Before the Supabase stack, because it needs no database and a
      # missing answer should fail in ten seconds rather than two
      # minutes.
      - name: Migration questions answered
        if: steps.changes.outputs.migrations_changed == 'true'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-migration-answers.mjs

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.migrations_changed == 'true'
        with:
          version: latest

      - name: Start local Supabase stack (applies migrations)
        if: steps.changes.outputs.migrations_changed == 'true'
        run: supabase db start

      - name: Lint schema
        if: steps.changes.outputs.migrations_changed == 'true'
        run: supabase db lint --schema public,private --level warning --fail-on warning

      # `db lint` is plpgsql_check and has never looked at a comment.
      # This reads the same database it just built and checks that the
      # schema still describes itself -- which is what the chat's system
      # prompt is generated from.
      - name: Schema documentation
        if: steps.changes.outputs.migrations_changed == 'true'
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          node scripts/check-schema-docs.mjs
          node scripts/check-docs-db.mjs
          node scripts/check-rls-shape.mjs
          node scripts/check-anon-reach.mjs
